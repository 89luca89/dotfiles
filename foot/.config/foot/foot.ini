# -*- conf -*-
include=/usr/share/foot/themes/alacritty
include=/usr/share/foot/themes/material-amber

font=monospace:size=14
initial-color-theme=dark

[cursor]
style=block
blink=no

[security]
# programs, remote ones included, may set the clipboard but not read it
osc52=copy-enabled

[csd]
preferred=client
size=0

[colors-dark]
background=000000
foreground=ffffff
234=1c1c1c

[colors-light]
foreground=000000
background=ffffff
234=f0f0f0

# vim: ft=dosini
