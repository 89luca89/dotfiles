[/]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom4/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom5/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom6/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom7/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom8/']
home=['<Super>e']
next=@as []
previous=@as []
screensaver=['<Super>l']
terminal=@as []
www=['<Super>w']

[custom-keybindings/custom0]
binding='<Super>t'
command='ptyxis --new-window'
name='Terminal'

[custom-keybindings/custom1]
binding='<Super>s'
command='flatpak run org.keepassxc.KeePassXC'
name='Keepass'

[custom-keybindings/custom2]
binding='<Super>g'
command='/home/luca-linux/dotfiles/bin/.local/bin/switch-grayscale'
name='Grayscale'

[custom-keybindings/custom3]
binding='<Super>c'
command=' ytdl_play'
name='PlayYTDL'

[custom-keybindings/custom4]
binding='<Super>d'
command='/home/luca-linux/dotfiles/bin/.local/bin/switch-theme'
name='Theme'

[custom-keybindings/custom5]
binding='<Control><Alt>t'
command='ptyxis --new-window -e distrobox enter default_distrobox -- tmux'
name='Terminal Tmux'

[custom-keybindings/custom6]
binding='<Super>i'
command="bash -c 'notify-send \"$(tmux-status)\"'"
name='Status'

[custom-keybindings/custom7]
binding='<Super>Return'
command='ptyxis --new-window -e tmux'
name='Terminal Tmux'

[custom-keybindings/custom8]
binding='Favorites'
command='/home/luca-linux/bin/browser-powersave'
name='Browser Powersave'
