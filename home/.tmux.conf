# ctrl-a
set -g prefix C-a
bind C-a send-prefix
bind-key a send-prefix
unbind C-b
# qol
set -g base-index 1
set -g mouse on
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
setw -g mode-keys vi
set -s escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# mosh forwards OSC 52 only as "52;c;", and tmux drops an Ms that never reads %p1
set -ag terminal-overrides ',xterm*:Ms=\E]52;c;%p1%l%Pa%p2%s\a'
# keybind
bind o setw synchronize-panes
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
# status bar
sync_ind_colour="#{?pane_synchronized,yellow,colour145}"
set -g pane-border-style fg=colour240
set -g status-interval 5
set -g status-style "bg=default"
set -g window-status-current-format "#[bg=${sync_ind_colour},fg=black,bold]  #I:#W \+  "
set -g status-left ""
set -g status-right "#[fg=default,bold]#(~/.local/bin/tmux-status) "
set -g status-right-length 160
