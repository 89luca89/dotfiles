[default_distrobox]
image=debian:testing
pull=true
init=false
start_now=true
pre_init_hooks="apt update || : && apt-mark hold systemd tpm-udev apparmor && { [ -f /etc/apt/sources.list.d/gh-cli-github.list ] || { mkdir -p /etc/apt/keyrings; (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg || wget -qO /etc/apt/keyrings/githubcli-archive-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg); echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' > /etc/apt/sources.list.d/gh-cli-github.list; apt update || :; }; } && { [ -f /etc/apt/sources.list.d/google-cloud-sdk.list ] || { mkdir -p /etc/apt/keyrings; (curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg -o /etc/apt/keyrings/cloud.google.asc || wget -qO /etc/apt/keyrings/cloud.google.asc https://packages.cloud.google.com/apt/doc/apt-key.gpg); echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/cloud.google.asc] https://packages.cloud.google.com/apt cloud-sdk main' > /etc/apt/sources.list.d/google-cloud-sdk.list; apt update || :; }; }"
# Basic utilities for terminal use
additional_packages="apt-file dos2unix locales-all acpi lm-sensors linux-cpupower adb fastboot iotop iftop htop util-linux opus-tools mpv intel-media-va-driver mesa-va-drivers"
additional_packages="gawk moreutils parallel cpio ncat bind9-utils net-tools openssl psmisc rsync tree wl-clipboard curl wget socat"
# TUI Tools
additional_packages="jq tig tmux vim neomutt w3m ripgrep bubblewrap"
# Development packages
additional_packages="git gh git-email gitsign cosign kubernetes-client kind google-cloud-cli build-essential libsecret-1-0 libsecret-1-dev libglib2.0-dev gettext"
additional_packages="shellcheck bear cmake clang clang-format clangd clang-tidy clang-tools libclang-dev llvm-dev codespell universal-ctags gcc shfmt golang rustup"
additional_packages="systemd-ukify sbsigntool ovmf erofs-utils btrfs-progs cryptsetup tpm2-tools swtpm cpio"
# Python
additional_packages="python3 python3-pip pipx yamllint"
# Virtualization
additional_packages="qemu-system"
# Generic
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/docker
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/docker-compose
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/flatpak
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/podman
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/xdg-open
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/wpctl
# check if we're online
init_hooks="ping -c1 1.1.1.1"
init_hooks=GOPATH="/usr/local/share/go" GOBIN=/usr/local/bin go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
init_hooks=GOPATH="/usr/local/share/go" GOBIN=/usr/local/bin go install github.com/onsi/ginkgo/v2/ginkgo@latest
init_hooks=GOPATH="/usr/local/share/go" GOBIN=/usr/local/bin go install golang.org/x/tools/cmd/goimports@latest
init_hooks=GOPATH="/usr/local/share/go" GOBIN=/usr/local/bin go install golang.org/x/tools/gopls@latest
init_hooks=GOPATH="/usr/local/share/go" GOBIN=/usr/local/bin go install mvdan.cc/gofumpt@latest
init_hooks=pipx install --global jedi-language-server pylint mypy yapf yt-dlp
init_hooks=make --directory=/usr/share/doc/git/contrib/credential/libsecret
init_hooks=echo done || echo distrobox: skipping not online
# Basic utilities for terminal use
exported_bins="/usr/bin/yt-dlp /usr/bin/mpv /usr/bin/wl-paste /usr/bin/wl-copy"
exported_bins="/usr/bin/shellcheck /usr/bin/ctags /usr/bin/bear"
exported_bins="/usr/share/doc/git/contrib/credential/libsecret/git-credential-libsecret"
